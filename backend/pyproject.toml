[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-automation-api"
version = "0.1.0"
description = "FastAPI backend for the Orbit workflow automation platform"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.136,<1",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.46,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
